spring:
  profiles:
    active: local
  
  # Database 설정 (PostgreSQL 예시)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/giglog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public # 서비스별 모듈에서 개별적으로 오버라이드 예정
  
  # OAuth2 설정 틀
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:your_kakao_client_id}
            client-secret: ${KAKAO_CLIENT_SECRET:your_kakao_client_secret}
            redirect-uri: "{baseUrl}/api/v1/auth/kakao/callback"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID:your_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret}
            redirect-uri: "{baseUrl}/api/v1/auth/google/callback"
            scope:
              - profile
              - email

# JWT 관련 설정
jwt:
  secret: ${JWT_SECRET:very_long_secret_key_at_least_256_bits_for_security_purposes_12345}
  access-token-expiration: 1800000 # 30분
  refresh-token-expiration: 604800000 # 7일

# Kafka 설정 틀
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
