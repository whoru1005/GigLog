server:
  port: 8084

spring:
  application:
    name: notification-service

  profiles:
    active: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/showlog_db}
    username: ${DB_USERNAME:showlog}
    password: ${DB_PASSWORD:showlog123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: notification_schema

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.giglog.*"

flyway:
  enabled: true
  locations: classpath:db/migration
  default-schema: notification_schema

# FCM 서비스 계정 키 파일 경로 (src/main/resources/firebase/ 에 위치)
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase/service-account.json}