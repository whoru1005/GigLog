version: '3.8'

services:
  # PostgreSQL 15
  postgres:
    image: postgres:15
    container_name: showlog-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: showlog_db
      POSTGRES_USER: showlog
      POSTGRES_PASSWORD: showlog123
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    networks:
      - showlog-network

  # Redis 7
  redis:
    image: redis:7
    container_name: showlog-redis
    ports:
      - "6379:6379"
    volumes:
      - ./docker/data/redis:/data
    networks:
      - showlog-network

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: showlog-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - showlog-network

  # Kafka 3.x
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: showlog-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 초기 토픽 자동 생성 (KAFKA_CREATE_TOPICS는 공식 이미지에서 지원하지 않으므로, Kafka UI 또는 수동 생성이 필요할 수 있으나 UI에서 처리 가능)
    volumes:
      - ./docker/data/kafka:/var/lib/kafka/data
    networks:
      - showlog-network

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: showlog-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8081:8080" # 호스트 8080 포트가 충돌할 수 있어 8081로 임시 지정 (필요 시 수정 가능)
    environment:
      KAFKA_CLUSTERS_0_NAME: showlog-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - showlog-network

networks:
  showlog-network:
    driver: bridge
