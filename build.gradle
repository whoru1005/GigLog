plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.11' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

ext {
    springCloudVersion = '2023.0.3'
}

allprojects {
    group = 'com.giglog'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // Spring Cloud & Spring Boot BOM 중앙 관리
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.11"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        // api-gateway 는 WebFlux 기반이므로 Servlet/JPA 의존성을 가진 common 에서 제외
        if (project.name != 'common' && project.name != 'api-gateway') {
            implementation project(':common')
        }

        // Lombok (모든 모듈 공통)
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        // Validation (api-gateway 제외 — WebFlux 기반으로 Servlet 스택과 충돌)
        if (project.name != 'api-gateway') {
            implementation 'org.springframework.boot:spring-boot-starter-validation'
        }

        // Testing
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}